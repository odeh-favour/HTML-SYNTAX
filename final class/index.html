<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dream Football Match</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="scoreboard">
        <span>Team Pink: <span id="scorePink">0</span></span>
        <span id="clock">Time: 00:00</span>
        <span>Team White: <span id="scoreWhite">0</span></span>
    </div>
    
    <div id="commentary">Commentator: Welcome to the grand match! The players are ready on the pitch.</div>

    <canvas id="pitch" width="800" height="500"></canvas>

    <div id="controls-help">
        <p><strong>Controls:</strong> Arrow Keys = Move Player | <strong>Space</strong> = Pass/Kick | <strong>J</strong> = Jump</p>
    </div>

    <script src="script.js"></script>
</body>
</html>
